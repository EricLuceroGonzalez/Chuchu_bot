[project]
name = "chuchu-bot"
version = "0.2.0"
description = "Bot de citas literarias para Bluesky y Mastodon (X desactivado)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atproto>=0.0.61",
    "mastodon-py>=2.0",
    "pillow>=11.0",
    "pymongo>=4.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# X está apagado. Para reactivarlo: uv sync --extra x
x = ["tweepy>=4.14"]

[tool.uv]
package = false
